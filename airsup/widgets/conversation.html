<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      --text: var(--color-text-primary, CanvasText);
      --muted: var(--color-text-secondary, color-mix(in srgb, CanvasText 55%, Canvas));
      --faint: var(--color-text-tertiary, color-mix(in srgb, CanvasText 38%, Canvas));
      --line: var(--color-border-primary, color-mix(in srgb, CanvasText 10%, Canvas));
      --fill: var(--color-background-secondary, color-mix(in srgb, CanvasText 7%, Canvas));
      --composer: var(--color-background-tertiary, color-mix(in srgb, CanvasText 7%, Canvas));
      --you: #3d6ea8;
      --you-text: #f4f7fb;
      --accent: #7e9bb4;
      --glow: color-mix(in srgb, #7e9bb4 16%, transparent);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --you: #3e6f9e;
        --you-text: #eef3f8;
        --accent: #8eabc0;
      }
    }
    @media (prefers-color-scheme: light) {
      :root {
        --you: #3a6ea5;
        --you-text: #f7f9fc;
        --accent: #4d7394;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      min-height: 680px;
      background: transparent;
      overflow: hidden;
    }
    #root {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 680px;
      height: 100%;
      padding: 18px 18px 14px;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    #root::before {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0 auto auto 0;
      width: 140px;
      height: 80px;
      background: radial-gradient(ellipse at 12% 0, var(--glow), transparent 70%);
    }
    .top {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .name {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .mark {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex: 0 0 auto;
    }
    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 590;
      letter-spacing: -0.021em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .state {
      flex: 0 1 auto;
      max-width: 42%;
      font-size: 12px;
      letter-spacing: 0.01em;
      color: var(--muted);
      text-align: right;
      line-height: 1.3;
    }
    .threads {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }
    .thread {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font: 12px inherit;
      border-radius: 999px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .thread.on {
      color: var(--text);
      border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
    }
    .transcript {
      position: relative;
      margin-top: 16px;
      flex: 1 1 auto;
      min-height: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .msg {
      display: flex;
      flex-direction: column;
      width: fit-content;
      max-width: 88%;
    }
    .msg.you { align-self: flex-end; align-items: flex-end; }
    .msg.them { align-self: flex-start; align-items: flex-start; }
    .lbl {
      font-size: 11px;
      color: var(--faint);
      margin: 0 12px 4px;
    }
    .bubble {
      margin: 0;
      padding: 10px 15px;
      border-radius: 18px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .msg.them .bubble {
      background: var(--fill);
      border: 1px solid var(--line);
      border-bottom-left-radius: 6px;
    }
    .msg.you .bubble {
      background: var(--you);
      color: var(--you-text);
      border-bottom-right-radius: 6px;
    }
    .bubble.pending {
      min-width: 52px;
      letter-spacing: 0.18em;
      opacity: 0.55;
    }
    .composer {
      position: relative;
      margin-top: 14px;
      flex: 0 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 8px 8px 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--composer);
    }
    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: inherit;
      font: inherit;
      min-height: 40px;
      max-height: 140px;
      padding: 10px 0;
    }
    .send {
      border: 0;
      background: var(--accent);
      color: #f4f7fb;
      font: 600 13px/1 inherit;
      border-radius: 16px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .send:disabled,
    textarea:disabled { opacity: 0.45; cursor: default; }
    .foot {
      position: relative;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .err { margin: 0; font-size: 12px; color: var(--muted); }
    .end, .cancel {
      border: 0;
      background: transparent;
      color: var(--faint);
      font: 12px inherit;
      cursor: pointer;
      padding: 0;
    }
    .end.ask { color: var(--text); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="root">
    <div class="top">
      <div class="name">
        <span id="mark" class="mark"></span>
        <h1 id="title">Airsup</h1>
      </div>
      <span id="state" class="state hidden">Live</span>
    </div>
    <div id="threads" class="threads hidden"></div>
    <div id="transcript" class="transcript hidden"></div>
    <form id="composer" class="composer hidden">
      <textarea id="draft" rows="1" placeholder="Your message" maxlength="8000"></textarea>
      <button class="send" type="submit">Send</button>
    </form>
    <div id="foot" class="foot hidden">
      <p id="err" class="err"></p>
      <div>
        <button id="cancel" class="cancel hidden" type="button">Cancel</button>
        <button id="end" class="end hidden" type="button">End conversation</button>
      </div>
    </div>
  </div>
  <script>
    const pending = new Map();
    let nextId = 1;
    let panel = null;
    let structured = {};
    let latestInput = {};
    let busy = false;
    let ending = false;
    let lastHeight = 0;
    const cache = new Map();

    function pick(data) {
      if (!data || typeof data !== 'object') return {};
      if (data.structuredContent && typeof data.structuredContent === 'object') {
        return data.structuredContent;
      }
      return data;
    }
    function panelFrom(raw) {
      if (!raw || typeof raw !== 'object') return null;
      if (raw._meta && raw._meta.ui && raw._meta.ui.panel) return raw._meta.ui.panel;
      if (raw.ui && raw.ui.panel) return raw.ui.panel;
      if (raw.toolResponseMetadata) return panelFrom(raw.toolResponseMetadata);
      if (raw.meta) return panelFrom(raw.meta);
      if (Array.isArray(raw.messages)) return raw;
      return null;
    }
    function hostPanel() {
      const o = window.openai || {};
      return panelFrom(o.toolOutput) || panelFrom(o.toolResponseMetadata) || panelFrom(o.meta);
    }
    function inputFrom(raw) {
      if (!raw || typeof raw !== 'object') return {};
      if (raw.arguments && typeof raw.arguments === 'object') return raw.arguments;
      return raw;
    }
    function currentInput() {
      return inputFrom(latestInput) || inputFrom(window.openai && window.openai.toolInput) || {};
    }
    function withOutgoing(messages) {
      const rows = (messages || []).slice();
      const outgoing = String(currentInput().message || '').trim();
      if (!outgoing) return rows;
      if (rows.some(function (row) { return row.from === 'you' && row.body === outgoing; })) return rows;
      rows.push({ from: 'you', name: 'You', body: outgoing });
      return rows;
    }
    function liveMessages(waitingNow) {
      const otherName = (panel && panel.other && panel.other.name) || 'Supplier';
      const rows = withOutgoing((panel && panel.messages) || []);
      const reply = String(structured.reply || '').trim();
      if (reply) {
        const already = rows.some(function (row) { return row.from === 'them' && row.body === reply; });
        if (!already) rows.push({ from: 'them', name: otherName, body: reply });
      }
      if (waitingNow) {
        const last = rows[rows.length - 1];
        if (!last || last.from === 'you') {
          rows.push({ from: 'them', name: otherName, body: '...', pending: true });
        }
      }
      return rows;
    }
    function rpc(method, params, timeoutMs) {
      const id = nextId++;
      window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
      return new Promise(function (resolve, reject) {
        const timer = setTimeout(function () {
          pending.delete(id);
          reject(new Error('That took too long.'));
        }, timeoutMs || 280000);
        pending.set(id, {
          resolve: function (value) { clearTimeout(timer); resolve(value); },
          reject: function (error) { clearTimeout(timer); reject(error); },
        });
      });
    }
    async function callTool(name, args) {
      if (window.openai && typeof window.openai.callTool === 'function') {
        return window.openai.callTool(name, args);
      }
      return rpc('tools/call', { name: name, arguments: args });
    }
    async function readResource(uri) {
      const result = await rpc('resources/read', { uri: uri }, 1500);
      const text = result && result.contents && result.contents[0] && result.contents[0].text;
      return text ? JSON.parse(text) : null;
    }
    function tellModel(text) {
      window.parent.postMessage({
        jsonrpc: '2.0',
        method: 'ui/update-model-context',
        params: { content: [{ type: 'text', text: text }] },
      }, '*');
    }
    const MIN_HEIGHT = 680;
    function reportHeight() {
      const root = document.getElementById('root');
      const height = Math.max(MIN_HEIGHT, Math.ceil(root.getBoundingClientRect().height));
      if (!height || height === lastHeight) return;
      lastHeight = height;
      if (window.openai && typeof window.openai.notifyIntrinsicHeight === 'function') {
        window.openai.notifyIntrinsicHeight(height);
      }
    }
    function setBusy(next) {
      busy = next;
      document.getElementById('draft').disabled = next;
      document.querySelector('.send').disabled = next;
    }
    function statusCopy(status, waiting, otherName) {
      if (status === 'ended') return 'Ended';
      if (status === 'failed') return 'Could not complete';
      if (otherName) return waiting ? 'Live' : 'Live';
      return 'Live';
    }
    function renderMessages(messages, otherName) {
      const root = document.getElementById('transcript');
      root.replaceChildren();
      const rows = messages || [];
      if (!rows.length) {
        root.classList.remove('hidden');
        return;
      }
      rows.forEach(function (item) {
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + (item.from === 'you' ? 'you' : 'them');
        if (item.from === 'you') {
          const lbl = document.createElement('div');
          lbl.className = 'lbl';
          lbl.textContent = 'You';
          wrap.appendChild(lbl);
        } else if (item.name && item.name !== otherName) {
          const lbl = document.createElement('div');
          lbl.className = 'lbl';
          lbl.textContent = item.name;
          wrap.appendChild(lbl);
        }
        const bubble = document.createElement('p');
        bubble.className = 'bubble' + (item.pending ? ' pending' : '');
        bubble.textContent = item.body || '';
        wrap.appendChild(bubble);
        root.appendChild(wrap);
      });
      root.classList.remove('hidden');
      root.scrollTop = root.scrollHeight;
    }
    function renderThreads(threads, conversationId) {
      const root = document.getElementById('threads');
      root.replaceChildren();
      const rows = threads || [];
      if (rows.length < 2) {
        root.classList.add('hidden');
        return;
      }
      rows.forEach(function (thread) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'thread' + (thread.conversation_id === conversationId ? ' on' : '');
        button.textContent = thread.other && thread.other.name ? thread.other.name : 'Conversation';
        button.addEventListener('click', function () {
          switchThread(thread.conversation_id);
        });
        root.appendChild(button);
      });
      root.classList.remove('hidden');
    }
    function render(nextStructured, nextPanel, waiting) {
      structured = pick(nextStructured);
      if (nextPanel) panel = nextPanel;
      else panel = panelFrom(nextStructured) || panel;
      const conversationId = (panel && panel.conversation_id) || structured.conversation_id || '';
      const status = (panel && panel.status) || structured.status || '';
      const otherName = panel && panel.other && panel.other.name;
      const waitingNow = Boolean(waiting) && status !== 'ended' && status !== 'failed' && !String(structured.reply || '').trim();
      document.getElementById('title').textContent = otherName || 'Airsup';
      document.getElementById('state').textContent = statusCopy(status, waitingNow, otherName);
      document.getElementById('state').classList.toggle('hidden', status !== 'ended' && status !== 'failed');
      const rows = liveMessages(waitingNow);
      renderMessages(rows, otherName);
      renderThreads(panel && panel.threads, conversationId);
      const open = Boolean(conversationId) && status !== 'ended' && status !== 'failed';
      document.getElementById('composer').classList.toggle('hidden', !open);
      const showEnd = Boolean(conversationId) && status !== 'ended';
      document.getElementById('end').classList.toggle('hidden', !showEnd);
      document.getElementById('end').textContent = ending ? 'End now' : 'End conversation';
      document.getElementById('end').classList.toggle('ask', ending);
      document.getElementById('cancel').classList.toggle('hidden', !ending);
      const showFoot = showEnd || Boolean(document.getElementById('err').textContent);
      document.getElementById('foot').classList.toggle('hidden', !showFoot);
      if (window.openai && typeof window.openai.setWidgetState === 'function') {
        window.openai.setWidgetState({
          conversation_id: conversationId,
          messages: rows.filter(function (row) { return !row.pending; }),
        });
      }
      if (panel && panel.conversation_id) cache.set(panel.conversation_id, panel);
      lastHeight = 0;
      reportHeight();
    }
    function hydrate(raw) {
      const data = pick(raw);
      const next = panelFrom(raw) || hostPanel();
      render(data, next, !data.status && !String(data.reply || '').trim());
    }
    async function sendMessage(event) {
      event.preventDefault();
      const conversationId = (panel && panel.conversation_id) || structured.conversation_id;
      const message = document.getElementById('draft').value.trim();
      if (!conversationId || !message || busy) return;
      latestInput = { conversation_id: conversationId, message: message };
      setBusy(true);
      document.getElementById('err').textContent = '';
      render(structured, panel, true);
      try {
        const result = await callTool('send_message', { conversation_id: conversationId, message: message });
        document.getElementById('draft').value = '';
        document.getElementById('draft').style.height = 'auto';
        tellModel('User sent a message in the Airsup panel. conversation_id is ' + conversationId + '.');
        await hydrate(result);
      } catch (error) {
        document.getElementById('err').textContent = error.message || 'Could not send.';
        render(structured, panel, false);
      }
      setBusy(false);
    }
    async function endConversation() {
      const conversationId = (panel && panel.conversation_id) || structured.conversation_id;
      if (!conversationId || busy) return;
      if (!ending) {
        ending = true;
        render(structured, panel, false);
        return;
      }
      setBusy(true);
      document.getElementById('err').textContent = '';
      try {
        const result = await callTool('end_conversation', { conversation_id: conversationId });
        tellModel('User ended Airsup conversation ' + conversationId + '.');
        ending = false;
        await hydrate(result);
      } catch (error) {
        document.getElementById('err').textContent = error.message || 'Could not end.';
      }
      setBusy(false);
    }
    async function switchThread(conversationId) {
      if (!conversationId || busy) return;
      setBusy(true);
      document.getElementById('err').textContent = '';
      try {
        let next = null;
        try { next = await readResource('airsup://conversations/' + conversationId); }
        catch (error) { next = cache.get(conversationId) || null; }
        if (!next) {
          const thread = ((panel && panel.threads) || []).find(function (row) {
            return row.conversation_id === conversationId;
          });
          next = {
            conversation_id: conversationId,
            status: thread ? thread.status : '',
            you: panel && panel.you,
            other: thread && thread.other,
            messages: [],
            threads: panel && panel.threads,
          };
        }
        tellModel('User is viewing Airsup conversation ' + conversationId + '. Use that conversation_id for later send_message calls.');
        render({ conversation_id: conversationId, status: next.status, reply: null }, next, false);
      } catch (error) {
        document.getElementById('err').textContent = error.message || 'Could not open that conversation.';
      }
      setBusy(false);
    }

    document.getElementById('composer').addEventListener('submit', sendMessage);
    document.getElementById('end').addEventListener('click', endConversation);
    document.getElementById('cancel').addEventListener('click', function () {
      ending = false;
      render(structured, panel, false);
    });
    document.getElementById('draft').addEventListener('input', function (event) {
      event.target.style.height = 'auto';
      event.target.style.height = Math.min(event.target.scrollHeight, 140) + 'px';
      lastHeight = 0;
      reportHeight();
    });
    document.getElementById('draft').addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        document.getElementById('composer').requestSubmit();
      }
    });

    window.addEventListener('message', function (event) {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (!message || message.jsonrpc !== '2.0') return;
      if (message.id !== undefined && pending.has(message.id)) {
        const item = pending.get(message.id);
        pending.delete(message.id);
        if (message.error) item.reject(new Error(message.error.message || 'Request failed'));
        else item.resolve(message.result);
        return;
      }
      if (message.method === 'ui/notifications/tool-input') {
        latestInput = inputFrom(message.params);
        render(structured, panel, true);
        return;
      }
      if (message.method === 'ui/notifications/tool-result') {
        hydrate(message.params);
      }
    }, { passive: true });
    window.addEventListener('openai:set_globals', function (event) {
      const globals = event.detail && event.detail.globals;
      if (globals && globals.toolInput) latestInput = inputFrom(globals.toolInput);
      const out = globals && globals.toolOutput;
      const data = pick(out);
      const next = panelFrom(out) || panelFrom(globals && globals.toolResponseMetadata) || panelFrom(globals && globals.meta);
      if (data && (data.status || data.reply)) render(data, next || hostPanel(), false);
      else if (String(currentInput().message || '').trim()) render(structured, panel, true);
    }, { passive: true });
    if (typeof ResizeObserver === 'function') {
      new ResizeObserver(function () {
        lastHeight = 0;
        reportHeight();
      }).observe(document.getElementById('root'));
    }
    latestInput = inputFrom(window.openai && window.openai.toolInput);
    const saved = window.openai && window.openai.widgetState;
    if (saved && Array.isArray(saved.messages) && saved.messages.length) {
      panel = {
        conversation_id: saved.conversation_id || '',
        status: 'open',
        messages: saved.messages,
        threads: [],
      };
    }
    hydrate(window.openai && window.openai.toolOutput);
  </script>
</body>
</html>
