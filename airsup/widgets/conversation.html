<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      --text: var(--color-text-primary, CanvasText);
      --muted: var(--color-text-secondary, color-mix(in srgb, CanvasText 64%, Canvas));
      --line: var(--color-border-primary, color-mix(in srgb, CanvasText 16%, Canvas));
      --fill: var(--color-background-secondary, color-mix(in srgb, CanvasText 7%, Canvas));
      --accent: #d07a82;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: transparent;
    }
    body {
      padding: 16px 16px 14px;
      font: 15px/1.45 var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
      color: var(--text);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex: 0 0 auto;
    }
    .dot.pulse {
      animation: pulse 1.4s ease-in-out infinite;
    }
    .name {
      font-size: 13px;
      font-weight: 600;
    }
    .pill {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      white-space: nowrap;
    }
    .pill.waiting { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
    .copy {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .copy.primary { color: var(--text); }
    .reply {
      margin-top: 12px;
      padding: 12px 13px;
      background: var(--fill);
      border: 1px solid var(--line);
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .reply:empty,
    .id:empty { display: none; }
    .id {
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
      font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
  </style>
</head>
<body>
  <div class="row">
    <div class="brand">
      <span id="dot" class="dot pulse"></span>
      <span class="name">Airsup</span>
    </div>
    <span id="pill" class="pill waiting">Waiting</span>
  </div>
  <p id="copy" class="copy">Waiting for the other Airsup AI…</p>
  <div id="reply" class="reply"></div>
  <div id="id" class="id"></div>
  <script>
    function pick(data) {
      if (!data || typeof data !== 'object') return {};
      if (data.structuredContent && typeof data.structuredContent === 'object') {
        return data.structuredContent;
      }
      return data;
    }
    function labelFor(status) {
      if (status === 'replied') return 'Replied';
      if (status === 'ended') return 'Ended';
      if (status === 'failed') return 'Failed';
      return 'Waiting';
    }
    function copyFor(status) {
      if (status === 'replied') return 'Reply from the other Airsup AI';
      if (status === 'ended') return 'This conversation has ended.';
      if (status === 'failed') return 'This message could not be completed.';
      return 'Waiting for the other Airsup AI…';
    }
    function reportHeight() {
      const height = Math.ceil(document.body.scrollHeight);
      const api = window.openai;
      if (api && typeof api.notifyIntrinsicHeight === 'function') {
        api.notifyIntrinsicHeight(height);
      }
    }
    function render(raw) {
      const data = pick(raw);
      const status = data.status ? String(data.status) : '';
      const conversationId = data.conversation_id ? String(data.conversation_id) : '';
      const reply = data.reply == null ? '' : String(data.reply);
      const waiting = !status || status === 'waiting';
      document.getElementById('dot').className = waiting ? 'dot pulse' : 'dot';
      document.getElementById('pill').className = 'pill ' + (status || 'waiting');
      document.getElementById('pill').textContent = labelFor(status);
      const copy = document.getElementById('copy');
      copy.className = status && status !== 'waiting' ? 'copy primary' : 'copy';
      copy.textContent = copyFor(status);
      document.getElementById('reply').textContent = reply;
      document.getElementById('id').textContent = conversationId ? ('conversation ' + conversationId) : '';
      reportHeight();
    }
    render(window.openai && window.openai.toolOutput);
    if (typeof ResizeObserver === 'function') {
      new ResizeObserver(reportHeight).observe(document.body);
    }
    window.addEventListener('openai:set_globals', function (event) {
      const globals = event.detail && event.detail.globals;
      render(globals && globals.toolOutput);
    }, { passive: true });
    window.addEventListener('message', function (event) {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (!message || message.jsonrpc !== '2.0') return;
      if (message.method !== 'ui/notifications/tool-result') return;
      render(message.params);
    }, { passive: true });
  </script>
</body>
</html>
