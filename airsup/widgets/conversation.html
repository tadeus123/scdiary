<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      --text: var(--color-text-primary, CanvasText);
      --muted: var(--color-text-secondary, color-mix(in srgb, CanvasText 55%, Canvas));
      --faint: var(--color-text-tertiary, color-mix(in srgb, CanvasText 38%, Canvas));
      --line: var(--color-border-primary, color-mix(in srgb, CanvasText 10%, Canvas));
      --fill: var(--color-background-secondary, color-mix(in srgb, CanvasText 7%, Canvas));
      --you: #3d6ea8;
      --you-text: #f4f7fb;
      --accent: #7e9bb4;
      --glow: color-mix(in srgb, #7e9bb4 16%, transparent);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --you: #3e6f9e;
        --you-text: #eef3f8;
        --accent: #8eabc0;
      }
    }
    @media (prefers-color-scheme: light) {
      :root {
        --you: #3a6ea5;
        --you-text: #f7f9fc;
        --accent: #4d7394;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: auto;
      min-height: 0;
      background: transparent;
      overflow: hidden;
    }
    #root {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
      width: 100%;
      height: auto;
      padding: 14px 18px 12px;
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      pointer-events: auto;
    }
    #root::before {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0 auto auto 0;
      width: 140px;
      height: 80px;
      background: radial-gradient(ellipse at 12% 0, var(--glow), transparent 70%);
    }
    .top {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .name {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .mark {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex: 0 0 auto;
    }
    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 590;
      letter-spacing: -0.021em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .corner {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex: 0 0 auto;
    }
    .state {
      font-size: 12px;
      letter-spacing: 0.01em;
      color: var(--muted);
      white-space: nowrap;
    }
    .end {
      border: 1px solid var(--line);
      background: color-mix(in srgb, Canvas 82%, CanvasText);
      color: var(--text);
      font: 600 12px/1 inherit;
      letter-spacing: 0.01em;
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .end:hover {
      border-color: color-mix(in srgb, var(--text) 28%, var(--line));
    }
    .end:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .threads {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }
    .thread {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font: 12px inherit;
      border-radius: 999px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .thread.on {
      color: var(--text);
      border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
    }
    .transcript {
      position: relative;
      margin-top: 14px;
      flex: 0 0 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: visible;
      padding: 2px 8px 4px;
    }
    .transcript::-webkit-scrollbar { display: none; }
    .msg {
      display: flex;
      flex-direction: column;
      width: fit-content;
      max-width: 74%;
    }
    .msg.you { align-self: flex-end; align-items: flex-end; margin-left: 26%; }
    .msg.them { align-self: flex-start; align-items: flex-start; margin-right: 26%; }
    .lbl {
      font-size: 11px;
      color: var(--faint);
      margin: 0 12px 4px;
    }
    .bubble {
      margin: 0;
      padding: 10px 15px;
      border-radius: 18px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .msg.them .bubble {
      background: var(--fill);
      border: 1px solid var(--line);
      border-bottom-left-radius: 6px;
    }
    .msg.you .bubble {
      background: var(--you);
      color: var(--you-text);
      border-bottom-right-radius: 6px;
    }
    .bubble.pending {
      min-width: 52px;
      min-height: 1.45em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.85;
    }
    .dots {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dots i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.28;
      animation: airsup-dot 1.2s infinite;
    }
    .dots i:nth-child(2) { animation-delay: 0.15s; }
    .dots i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes airsup-dot {
      0%, 80%, 100% { opacity: 0.28; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }
    .err { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
    .hidden { display: none !important; }
    html.superseded,
    html.superseded body,
    html.superseded #root {
      display: none !important;
      height: 0 !important;
      min-height: 0 !important;
      overflow: hidden !important;
      padding: 0 !important;
      margin: 0 !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="top">
      <div class="name">
        <span id="mark" class="mark"></span>
        <h1 id="title">Airsup</h1>
      </div>
      <div class="corner">
        <span id="state" class="state hidden">Ended</span>
        <button id="end" class="end hidden" type="button">End conversation</button>
      </div>
    </div>
    <div id="threads" class="threads hidden"></div>
    <div id="transcript" class="transcript hidden"></div>
    <p id="err" class="err hidden"></p>
  </div>
  <script>
    const pending = new Map();
    let nextId = 1;
    let panel = null;
    let structured = {};
    let latestInput = {};
    let busy = false;
    let ending = false;
    let lastHeight = 0;
    const cache = new Map();
    const born = Date.now() + Math.random();
    const peers = {};
    let lastPublished = '';
    let superseded = false;
    const channel = typeof BroadcastChannel === 'function' ? new BroadcastChannel('airsup-conversation') : null;

    function parseToolData(raw) {
      if (!raw || typeof raw !== 'object') return {};
      if (raw.structuredContent && typeof raw.structuredContent === 'object') {
        return raw.structuredContent;
      }
      if (raw.result && typeof raw.result === 'object') {
        const nested = parseToolData(raw.result);
        if (nested.status || nested.reply != null || nested.conversation_id) return nested;
      }
      if (Array.isArray(raw.content) && raw.content[0]) {
        const text = raw.content[0].text || raw.content[0];
        if (typeof text === 'string' && text.charAt(0) === '{') {
          try {
            const parsed = JSON.parse(text);
            if (parsed && typeof parsed === 'object') return parseToolData(parsed);
          } catch (error) {}
        }
      }
      if (raw.status || raw.reply != null || raw.conversation_id) return raw;
      return {};
    }
    function pick(data) {
      return parseToolData(data);
    }
    function panelFrom(raw, depth) {
      if (!raw || typeof raw !== 'object' || depth > 6) return null;
      if (raw._meta && raw._meta.ui && raw._meta.ui.panel) return raw._meta.ui.panel;
      if (raw.ui && raw.ui.panel) return raw.ui.panel;
      if (Array.isArray(raw.messages) && (raw.conversation_id || raw.other || raw.you || raw.messages.length)) {
        return raw;
      }
      const nested = [
        raw.toolResponseMetadata,
        raw.meta,
        raw._meta,
        raw.mcp_tool_result,
        raw.call_tool_result,
        raw.result,
      ];
      for (let i = 0; i < nested.length; i++) {
        const found = panelFrom(nested[i], (depth || 0) + 1);
        if (found) return found;
      }
      return null;
    }
    function hostPanel() {
      const o = window.openai || {};
      return panelFrom(o.toolOutput)
        || panelFrom(o.toolResponseMetadata)
        || panelFrom(o.meta)
        || panelFrom(o.widgetProps);
    }
    function syntheticPanel(data) {
      const input = currentInput();
      const outgoing = String(input.message || '').trim();
      const reply = String((data && data.reply) || '').trim();
      const saved = (panel && panel.messages) || [];
      const rows = saved.slice();
      if (outgoing && !rows.some(function (row) { return row.from === 'you' && row.body === outgoing; })) {
        rows.push({ from: 'you', name: 'You', body: outgoing });
      }
      if (reply && !rows.some(function (row) { return row.from === 'them' && row.body === reply; })) {
        rows.push({ from: 'them', name: (panel && panel.other && panel.other.name) || 'Airsup', body: reply });
      }
      const conversationId = (data && data.conversation_id)
        || (panel && panel.conversation_id)
        || String(input.conversation_id || '');
      if (!rows.length && !conversationId) return null;
      return {
        conversation_id: conversationId,
        status: (data && data.status) || (panel && panel.status) || 'open',
        you: (panel && panel.you) || { name: 'You' },
        other: (panel && panel.other) || { name: 'Airsup' },
        messages: rows,
        threads: (panel && panel.threads) || [],
      };
    }
    function inputFrom(raw) {
      if (!raw || typeof raw !== 'object') return {};
      if (raw.arguments && typeof raw.arguments === 'object') return raw.arguments;
      return raw;
    }
    function currentInput() {
      const fromLatest = inputFrom(latestInput);
      if (fromLatest && (fromLatest.message || fromLatest.conversation_id || fromLatest.person_id)) {
        return fromLatest;
      }
      return inputFrom(window.openai && window.openai.toolInput) || {};
    }
    function withOutgoing(messages) {
      const rows = (messages || []).slice();
      const outgoing = String(currentInput().message || '').trim();
      if (!outgoing) return rows;
      if (rows.some(function (row) { return row.from === 'you' && row.body === outgoing; })) return rows;
      rows.push({ from: 'you', name: 'You', body: outgoing });
      return rows;
    }
    function liveMessages(waitingNow) {
      const otherName = (panel && panel.other && panel.other.name) || 'Supplier';
      const rows = withOutgoing((panel && panel.messages) || []);
      const reply = String(structured.reply || '').trim();
      if (reply) {
        const already = rows.some(function (row) { return row.from === 'them' && row.body === reply; });
        if (!already) rows.push({ from: 'them', name: otherName, body: reply });
      }
      if (waitingNow) {
        const last = rows[rows.length - 1];
        if (!last || last.from === 'you') {
          rows.push({ from: 'them', name: otherName, body: '', pending: true });
        }
      }
      return rows;
    }
    function rpc(method, params, timeoutMs) {
      const id = nextId++;
      window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
      return new Promise(function (resolve, reject) {
        const timer = setTimeout(function () {
          pending.delete(id);
          reject(new Error('That took too long.'));
        }, timeoutMs || 280000);
        pending.set(id, {
          resolve: function (value) { clearTimeout(timer); resolve(value); },
          reject: function (error) { clearTimeout(timer); reject(error); },
        });
      });
    }
    async function callTool(name, args) {
      const companyChat = String((args && args.conversation_id) || '').indexOf('cn_') === 0;
      const timeoutMs = companyChat ? 20000 : 280000;
      if (window.openai && typeof window.openai.callTool === 'function') {
        return Promise.race([
          window.openai.callTool(name, args),
          new Promise(function (_, reject) {
            setTimeout(function () { reject(new Error('That took too long.')); }, timeoutMs);
          }),
        ]);
      }
      return rpc('tools/call', { name: name, arguments: args }, timeoutMs);
    }
    async function readResource(uri) {
      const result = await rpc('resources/read', { uri: uri }, 1500);
      const text = result && result.contents && result.contents[0] && result.contents[0].text;
      return text ? JSON.parse(text) : null;
    }
    function tellModel(text) {
      window.parent.postMessage({
        jsonrpc: '2.0',
        method: 'ui/update-model-context',
        params: { content: [{ type: 'text', text: text }] },
      }, '*');
    }
    const MIN_HEIGHT = 88;
    let lastSaved = '';
    function conversationKey() {
      return (panel && panel.conversation_id) || structured.conversation_id || String(currentInput().conversation_id || '');
    }
    function uniqueMessages(rows) {
      const out = [];
      const seen = {};
      (rows || []).forEach(function (row) {
        const body = String((row && row.body) || '');
        if (!body) return;
        const key = (row.from || '') + '\n' + body;
        if (seen[key]) return;
        seen[key] = true;
        out.push(row);
      });
      return out;
    }
    function absorbPeers(conversationId) {
      if (!conversationId || !panel) return;
      const extra = peers[conversationId] && peers[conversationId].messages;
      if (!extra || !extra.length) return;
      panel.messages = uniqueMessages((panel.messages || []).concat(extra));
    }
    function elect(conversationId) {
      if (!conversationId) return;
      const info = peers[conversationId];
      const newest = info && info.born > born ? info.born : born;
      const hide = newest > born;
      if (hide === superseded) return;
      superseded = hide;
      document.documentElement.classList.toggle('superseded', hide);
      lastHeight = -1;
      reportHeight();
    }
    function publish(force) {
      const conversationId = conversationKey();
      if (!channel || !conversationId) return;
      const messages = uniqueMessages(((panel && panel.messages) || []).concat(
        liveMessages(false).filter(function (row) { return !row.pending; })
      ));
      const payload = {
        type: 'airsup-sync',
        conversationId: conversationId,
        born: born,
        status: (panel && panel.status) || structured.status || '',
        other: panel && panel.other,
        messages: messages,
      };
      const packed = JSON.stringify(payload);
      if (!force && packed === lastPublished) return;
      lastPublished = packed;
      channel.postMessage(payload);
    }
    function reportHeight() {
      const root = document.getElementById('root');
      const height = superseded
        ? 1
        : Math.max(MIN_HEIGHT, Math.ceil(Math.max(
          root.getBoundingClientRect().height,
          root.scrollHeight
        )));
      if (!height || height === lastHeight) return;
      lastHeight = height;
      if (window.openai && typeof window.openai.notifyIntrinsicHeight === 'function') {
        window.openai.notifyIntrinsicHeight(height);
      }
      window.parent.postMessage({
        jsonrpc: '2.0',
        method: 'ui/notifications/size-changed',
        params: { height: height },
      }, '*');
    }
    function setBusy(next) {
      busy = next;
      const end = document.getElementById('end');
      if (end) end.disabled = next;
    }
    function setErr(text) {
      const err = document.getElementById('err');
      err.textContent = text || '';
      err.classList.toggle('hidden', !err.textContent);
    }
    function statusCopy(status, waiting, otherName) {
      if (status === 'ended') return 'Ended';
      if (status === 'failed') return 'Could not complete';
      if (otherName) return waiting ? 'Live' : 'Live';
      return 'Live';
    }
    function renderMessages(messages, otherName) {
      const root = document.getElementById('transcript');
      root.replaceChildren();
      const rows = messages || [];
      if (!rows.length) {
        root.replaceChildren();
        root.classList.add('hidden');
        return;
      }
      rows.forEach(function (item) {
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + (item.from === 'you' ? 'you' : 'them');
        if (item.from === 'you') {
          const lbl = document.createElement('div');
          lbl.className = 'lbl';
          lbl.textContent = 'You';
          wrap.appendChild(lbl);
        } else {
          const lbl = document.createElement('div');
          lbl.className = 'lbl';
          lbl.textContent = item.name || otherName || 'Airsup';
          wrap.appendChild(lbl);
        }
        const bubble = document.createElement('p');
        bubble.className = 'bubble' + (item.pending ? ' pending' : '');
        if (item.pending) {
          const dots = document.createElement('span');
          dots.className = 'dots';
          dots.appendChild(document.createElement('i'));
          dots.appendChild(document.createElement('i'));
          dots.appendChild(document.createElement('i'));
          bubble.appendChild(dots);
        } else {
          bubble.textContent = item.body || '';
        }
        wrap.appendChild(bubble);
        root.appendChild(wrap);
      });
      root.classList.remove('hidden');
      root.scrollTop = root.scrollHeight;
    }
    function renderThreads(threads, conversationId) {
      const root = document.getElementById('threads');
      root.replaceChildren();
      const rows = threads || [];
      if (rows.length < 2) {
        root.classList.add('hidden');
        return;
      }
      rows.forEach(function (thread) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'thread' + (thread.conversation_id === conversationId ? ' on' : '');
        button.textContent = thread.other && thread.other.name ? thread.other.name : 'Conversation';
        button.addEventListener('click', function () {
          switchThread(thread.conversation_id);
        });
        root.appendChild(button);
      });
      root.classList.remove('hidden');
    }
    function render(nextStructured, nextPanel, waiting) {
      structured = pick(nextStructured);
      if (nextPanel) panel = nextPanel;
      else panel = panelFrom(nextStructured) || panel;
      const conversationId = (panel && panel.conversation_id) || structured.conversation_id || String(currentInput().conversation_id || '');
      absorbPeers(conversationId);
      let status = (panel && panel.status) || structured.status || '';
      if (structured.status === 'ended' || (panel && panel.status === 'ended')) {
        status = 'ended';
        if (panel) panel.status = 'ended';
        structured.status = 'ended';
      }
      const otherName = panel && panel.other && panel.other.name;
      const waitingNow = Boolean(waiting) && status !== 'ended' && status !== 'failed' && !String(structured.reply || '').trim();
      document.getElementById('title').textContent = otherName || 'Airsup';
      document.getElementById('state').textContent = statusCopy(status, waitingNow, otherName);
      document.getElementById('state').classList.toggle('hidden', status !== 'ended' && status !== 'failed');
      const rows = liveMessages(waitingNow);
      renderMessages(rows, otherName);
      renderThreads(panel && panel.threads, conversationId);
      const showEnd = Boolean(conversationId) && status !== 'ended' && status !== 'failed';
      document.getElementById('end').classList.toggle('hidden', !showEnd);
      document.getElementById('end').textContent = ending ? 'Ending' : 'End conversation';
      document.getElementById('end').disabled = busy || ending;
      setErr(document.getElementById('err').textContent);
      const snapshot = JSON.stringify({
        conversation_id: conversationId,
        messages: rows.filter(function (row) { return !row.pending; }),
      });
      if (window.openai && typeof window.openai.setWidgetState === 'function' && snapshot !== lastSaved) {
        lastSaved = snapshot;
        window.openai.setWidgetState({
          conversation_id: conversationId,
          messages: rows.filter(function (row) { return !row.pending; }),
        });
      }
      if (panel && panel.conversation_id) cache.set(panel.conversation_id, panel);
      publish();
      elect(conversationId);
      lastHeight = 0;
      reportHeight();
    }
    function hasThemReply(data, nextPanel) {
      if (String((data && data.reply) || '').trim()) return true;
      const rows = (nextPanel && nextPanel.messages) || (panel && panel.messages) || [];
      return rows.some(function (row) { return row.from === 'them' && !row.pending && String(row.body || '').trim(); });
    }
    function hydrate(raw) {
      const data = pick(raw);
      const found = panelFrom(raw) || hostPanel();
      if (found) panel = found;
      const next = syntheticPanel(data) || found;
      const outgoing = String(currentInput().message || '').trim();
      const waiting = !hasThemReply(data, next) && (Boolean(outgoing) || busy);
      render(data, next, waiting);
    }
    function takeInput(raw) {
      latestInput = inputFrom(raw);
      const outgoing = String(currentInput().message || '').trim();
      if (!outgoing && !panel) {
        render(structured, panel, false);
        return;
      }
      render(structured, panel, !hasThemReply(structured, panel));
    }
    async function endConversation() {
      const conversationId = (panel && panel.conversation_id) || structured.conversation_id || String(currentInput().conversation_id || '');
      if (busy || ending) return;
      if (!conversationId) {
        setErr('No conversation to end yet.');
        return;
      }
      ending = true;
      setBusy(true);
      setErr('');
      document.getElementById('end').textContent = 'Ending';
      try {
        const result = await callTool('end_conversation', { conversation_id: conversationId });
        tellModel('The user ended Airsup conversation ' + conversationId + ' in the widget. Do not call send_message again for it.');
        if (panel) panel.status = 'ended';
        structured = Object.assign({}, structured, { conversation_id: conversationId, status: 'ended', reply: null });
        ending = false;
        await hydrate(result);
      } catch (error) {
        ending = false;
        setErr(error.message || 'Could not end.');
      }
      setBusy(false);
      render(structured, panel, false);
    }
    async function switchThread(conversationId) {
      if (!conversationId || busy) return;
      setBusy(true);
      setErr('');
      try {
        let next = null;
        try { next = await readResource('airsup://conversations/' + conversationId); }
        catch (error) { next = cache.get(conversationId) || null; }
        if (!next) {
          const thread = ((panel && panel.threads) || []).find(function (row) {
            return row.conversation_id === conversationId;
          });
          next = {
            conversation_id: conversationId,
            status: thread ? thread.status : '',
            you: panel && panel.you,
            other: thread && thread.other,
            messages: [],
            threads: panel && panel.threads,
          };
        }
        tellModel('User is viewing Airsup conversation ' + conversationId + '. Use that conversation_id for later send_message calls.');
        render({ conversation_id: conversationId, status: next.status, reply: null }, next, false);
      } catch (error) {
        setErr(error.message || 'Could not open that conversation.');
      }
      setBusy(false);
    }

    document.getElementById('end').addEventListener('click', endConversation);

    window.addEventListener('message', function (event) {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (!message || message.jsonrpc !== '2.0') return;
      if (message.id !== undefined && pending.has(message.id)) {
        const item = pending.get(message.id);
        pending.delete(message.id);
        if (message.error) item.reject(new Error(message.error.message || 'Request failed'));
        else item.resolve(message.result);
        return;
      }
      if (message.method === 'ui/initialize' && message.id !== undefined) {
        window.parent.postMessage({
          jsonrpc: '2.0',
          id: message.id,
          result: {
            protocolVersion: '2026-01-26',
            appInfo: { name: 'airsup', version: '15' },
            appCapabilities: { availableDisplayModes: ['inline', 'fullscreen', 'pip'] },
          },
        }, '*');
        window.parent.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/initialized' }, '*');
        hydrate(window.openai && window.openai.toolOutput);
        return;
      }
      if (message.method === 'ui/notifications/tool-input-partial') {
        takeInput(message.params);
        return;
      }
      if (message.method === 'ui/notifications/tool-input') {
        takeInput(message.params);
        return;
      }
      if (message.method === 'ui/notifications/tool-result') {
        hydrate(message.params);
      }
    }, { passive: true });
    window.addEventListener('openai:set_globals', function (event) {
      const globals = event.detail && event.detail.globals;
      if (globals && globals.toolInput) latestInput = inputFrom(globals.toolInput);
      const out = globals && globals.toolOutput;
      const data = pick(out);
      const found = panelFrom(out)
        || panelFrom(globals && globals.toolResponseMetadata)
        || panelFrom(globals && globals.meta)
        || hostPanel();
      if (found) panel = found;
      if (data && (data.status || data.reply || data.conversation_id)) {
        render(data, syntheticPanel(data) || found, !hasThemReply(data, found));
      } else if (String(currentInput().message || '').trim() || busy) {
        render(structured, panel, true);
      }
    }, { passive: true });
    if (typeof ResizeObserver === 'function') {
      new ResizeObserver(function () {
        lastHeight = 0;
        reportHeight();
      }).observe(document.getElementById('root'));
    }
    if (channel) {
      channel.addEventListener('message', function (event) {
        const payload = event.data;
        if (!payload || typeof payload !== 'object') return;
        if (payload.type === 'airsup-hello') {
          const asked = String(payload.conversationId || '');
          const mine = conversationKey();
          if (!asked || !mine || asked === mine) publish(true);
          return;
        }
        if (payload.type !== 'airsup-sync') return;
        const conversationId = String(payload.conversationId || '');
        if (!conversationId) return;
        const prev = peers[conversationId] || { born: 0, messages: [] };
        peers[conversationId] = {
          born: Math.max(prev.born, Number(payload.born) || 0),
          messages: uniqueMessages((prev.messages || []).concat(payload.messages || [])),
          other: payload.other || prev.other,
          status: payload.status || prev.status,
        };
        const mine = conversationKey();
        if (mine && mine !== conversationId) return;
        const before = ((panel && panel.messages) || []).length;
        absorbPeers(conversationId);
        elect(conversationId);
        if (!superseded && panel && ((panel.messages || []).length > before)) {
          render(structured, panel, false);
        }
      });
    }
    function connectHost() {
      window.parent.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/initialized' }, '*');
    }
    latestInput = inputFrom(window.openai && window.openai.toolInput);
    const saved = window.openai && window.openai.widgetState;
    if (saved && Array.isArray(saved.messages) && saved.messages.length) {
      panel = {
        conversation_id: saved.conversation_id || '',
        status: 'open',
        messages: saved.messages,
        threads: [],
      };
    }
    hydrate(window.openai && window.openai.toolOutput);
    connectHost();
    publish(true);
    if (channel) {
      channel.postMessage({ type: 'airsup-hello', conversationId: conversationKey(), born: born });
    }
  </script>
</body>
