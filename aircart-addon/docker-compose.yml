services:
  aircart-agent:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run build && npm start"
    environment:
      PUBLIC_ORIGIN: https://tademehl.com
      PORT: "8787"
      HOST: "0.0.0.0"
    ports:
      - "8787:8787"
    restart: unless-stopped
